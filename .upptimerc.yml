# Configuration Upptime pour cinelounge.org
owner: MaximeMada
repo: cinelounge-status

sites:
  - name: Cinelounge
    url: https://cinelounge.org
    # Au-delà de ce temps de réponse (ms), le site est marqué « dégradé »
    maxResponseTime: 3000
  # Ajoutez ici d'autres pages critiques si besoin, par exemple :
  # - name: Cinelounge – page de lecture
  #   url: https://cinelounge.org/chemin/important
  #   maxResponseTime: 5000

# Disponibilité vérifiée toutes les 5 min (commit uniquement si l'état change) ;
# temps de réponse enregistré toutes les 30 min (à :17 et :47, hors des heures
# pleines où GitHub retarde les tâches planifiées).
workflowSchedule:
  uptime: "*/5 * * * *"
  responseTime: "17,47 * * * *"

# Les issues d'incident vous sont assignées (notification e-mail)
assignees:
  - MaximeMada

status-website:
  # Page servie sur https://maximemada.github.io/cinelounge-status
  baseUrl: /cinelounge-status
  name: Cinelounge – Statut
  introTitle: "État du site **cinelounge.org**"
  introMessage: Disponibilité et temps de réponse mesurés toutes les 5 minutes depuis l'extérieur du serveur.
  navbar:
    - title: Statut
      href: /
    - title: cinelounge.org
      href: https://cinelounge.org

i18n:
  activeIncidents: Incidents en cours
  allSystemsOperational: Tous les services fonctionnent normalement
  incidentReport: "Rapport de l'incident #$NUMBER →"
  pastIncidents: Incidents passés
  pastIncidentsResolved: "Résolu en $MINUTES minutes avec $POSTS messages"
  liveStatus: État en direct
  overallUptime: "Disponibilité globale : $UPTIME"
  averageResponseTime: "Temps de réponse moyen : $TIME"
  up: Opérationnel
  down: Hors ligne
  degraded: Dégradé
  loading: Chargement
